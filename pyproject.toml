[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "localasr"
version = "0.1.9"
description = "基于 SenseVoice/FunASR 的本地单文件音频转文本工具"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "addict>=2.4",
  "funasr @ git+https://github.com/modelscope/FunASR.git@faffb45a331edafd8fe4d0bb741835954bb49d1f",
  "modelscope>=1.17.1",
  "tensorboard>=2.20",
  "torch>=2.3",
  "torchaudio>=2.3",
]

[project.optional-dependencies]
app = [
  "PySide6>=6.7",
  "pyinstaller>=6.8",
]
dev = [
  "pytest>=8.0",
]
gui = [
  "PySide6>=6.7",
]
onnx = [
  "numpy>=1.26",
  "sherpa-onnx>=1.13",
  "soundfile>=0.12",
]
packaging = [
  "pyinstaller>=6.8",
]

[project.scripts]
localasr = "localasr.cli:main"
localasr-gui = "localasr.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
localasr = ["assets/*"]
